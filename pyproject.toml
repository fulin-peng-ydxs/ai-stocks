[project]
name = "ai-stocks"
version = "0.1.0"
description = "A股趋势龙头选股、打分与回测系统（本地 EOD，FastAPI + Vue + DuckDB）"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "duckdb>=0.10",
    "pandas>=2.2",
    "numpy>=1.26",
    "akshare>=1.13",
    "baostock>=0.8.8",
    "mini-racer>=0.8",
    "APScheduler>=3.10",
    "psycopg[binary,pool]>=3.1",
    "redis>=5.0",
    "bcrypt>=3.2",
    "PyJWT>=2.15",
    "cryptography>=50.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "ruff>=0.4", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.coverage.run]
relative_files = true
omit = ["backend/tests/*"]

[tool.coverage.report]
show_missing = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
