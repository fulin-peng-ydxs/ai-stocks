<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- 黑白徽标:默认(白天)黑块白信号;深色主题反转为白块黑信号,跟随系统明暗切换。 -->
  <style>
    .tile { fill: #000000; }
    .line { stroke: #ffffff; }
    .dot  { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #ffffff; }
      .line { stroke: #000000; }
      .dot  { fill: #000000; }
    }
  </style>

  <rect class="tile" width="48" height="48" rx="14"/>

  <!-- 上行趋势信号(与 BrandMark 同一造型语言) -->
  <g class="line" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 31.5L18.5 24.5L24 27.5L34.5 17" stroke-width="4.4"/>
    <path d="M32.5 17H34.5V19" stroke-width="4.4"/>
  </g>
  <circle class="dot" cx="18.5" cy="24.5" r="2.5"/>
  <circle class="dot" cx="24" cy="27.5" r="2.3"/>
</svg>
