name: CI suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      kind:
        required: true
        type: string
      scale_stocks:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ inputs.kind != 'frontend' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: gate
          POSTGRES_PASSWORD: isolated-ci-gate
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gate -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
      - uses: actions/setup-node@v7
        if: inputs.kind == 'frontend'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: inputs.kind == 'frontend'
        run: npm ci --prefix frontend
      - if: inputs.kind != 'frontend'
        run: python -m pip install -r requirements-ci.txt
      - name: Prepare isolated Redis executable
        if: inputs.kind != 'frontend'
        run: |
          if ! command -v redis-server; then
            sudo apt-get update
            sudo apt-get install -y redis-server
          fi
      - name: Run registered suite
        env:
          CI_SUITE: ${{ inputs.suite }}
          CI_SCALE_STOCKS: ${{ inputs.scale_stocks }}
          AI_STOCKS_DB_GATE_ADMIN_DSN: postgresql://gate:isolated-ci-gate@127.0.0.1:5432/postgres
        run: |
          args=(run "$CI_SUITE")
          if [[ -n "$CI_SCALE_STOCKS" ]]; then
            args+=(--scale-stocks "$CI_SCALE_STOCKS")
          fi
          python -m backend.devtools.ci "${args[@]}"
      - name: Preserve diagnostic reports
        if: always() && inputs.kind != 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ inputs.suite }}-${{ github.run_attempt }}
          path: |
            .local/tmp/ai-agent/ci-*/ci-*.xml
            .local/tmp/ai-agent/ci-*/ci-redis-*.log
            .local/tmp/ai-agent/ci-*/database-gate-*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
