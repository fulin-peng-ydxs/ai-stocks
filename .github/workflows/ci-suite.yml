name: CI suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      kind:
        required: true
        type: string
      scale_stocks:
        type: string
        default: ''
      base_revision:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: ${{ (inputs.kind == 'backend' || inputs.kind == 'database' || inputs.kind == 'e2e') && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: gate
          POSTGRES_PASSWORD: isolated-ci-gate
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gate -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt
            requirements-quality.txt
            requirements-ci.lock
      - uses: actions/setup-node@v7
        if: inputs.kind == 'frontend' || inputs.kind == 'audit' || inputs.kind == 'e2e'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: inputs.kind == 'frontend' || inputs.kind == 'e2e'
        run: npm ci --prefix frontend
      - if: inputs.kind == 'backend' || inputs.kind == 'database' || inputs.kind == 'audit' || inputs.kind == 'e2e'
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Prepare Chromium for registered E2E
        if: inputs.kind == 'e2e'
        run: frontend/node_modules/.bin/playwright install --with-deps chromium
      - if: inputs.kind == 'quality'
        run: python -m pip install -r requirements-quality.txt
      - name: Prepare isolated Redis executable
        if: inputs.kind == 'backend' || inputs.kind == 'database' || inputs.kind == 'e2e'
        run: |
          if ! command -v redis-server; then
            sudo apt-get update
            sudo apt-get install -y redis-server
          fi
      - name: Run registered suite
        env:
          CI_SUITE: ${{ inputs.suite }}
          CI_SCALE_STOCKS: ${{ inputs.scale_stocks }}
          CI_BASE_REVISION: ${{ inputs.base_revision }}
          AI_STOCKS_DB_GATE_ADMIN_DSN: postgresql://gate:isolated-ci-gate@127.0.0.1:5432/postgres
        run: |
          args=(run "$CI_SUITE")
          if [[ -n "$CI_SCALE_STOCKS" ]]; then
            args+=(--scale-stocks "$CI_SCALE_STOCKS")
          fi
          if [[ -n "$CI_BASE_REVISION" ]]; then
            args+=(--base "$CI_BASE_REVISION" --head "$GITHUB_SHA")
          fi
          python -m backend.devtools.ci "${args[@]}"
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ inputs.suite }}-${{ github.run_attempt }}
          path: |
            .local/tmp/ai-agent/ci-results-*/**
            .local/tmp/ai-agent/ci-*/ci-*.xml
            .local/tmp/ai-agent/ci-*/ci-redis-*.log
            .local/tmp/ai-agent/ci-*/database-gate-*.log
            .local/tmp/ai-agent/ci-*/**/ci-frontend.json
            .local/tmp/ai-agent/ci-*/**/coverage*
            .local/tmp/ai-agent/ci-*/audit-*.json
            .local/tmp/ai-agent/ci-*/secrets-*.json
            .local/tmp/ai-agent/ci-*/ci-test-manifest.json
            .local/tmp/ai-agent/ci-*/scale-execution.json
            .local/tmp/ai-agent/ci-*/e2e-*.json
            .local/tmp/ai-agent/ci-*/e2e-backend.log
            .local/tmp/ai-agent/ci-*/e2e-results/**
            .local/tmp/ai-agent/ci-*/e2e-html/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
