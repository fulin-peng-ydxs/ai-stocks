name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 21 * * *' # 每日北京时间 05:00，仅调用依赖审计专项。
  workflow_dispatch:
    inputs:
      suite:
        description: 'common 或 config/ci-suites.json 中的套件名'
        default: common
        type: string
      scale_stocks:
        description: '仅 backend-scale 使用，显式填写 100..5000'
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'dependency-audit' || inputs.suite || 'common' }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate registry and generate matrix
        id: plan
        env:
          CI_SUITE: ${{ github.event_name == 'schedule' && 'dependency-audit' || inputs.suite || 'common' }}
        run: |
          python3 -m backend.devtools.ci check
          mkdir -p ".local/tmp/ai-agent/ci-plan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -m backend.devtools.ci assess > ".local/tmp/ai-agent/ci-plan-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/ci-impact.json"
          echo "matrix=$(python3 -m backend.devtools.ci plan "$CI_SUITE")" >> "$GITHUB_OUTPUT"
      - name: Preserve required-specials plan
        uses: actions/upload-artifact@v4
        with:
          name: ci-impact-${{ github.run_attempt }}
          path: .local/tmp/ai-agent/ci-plan-*/ci-impact.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  checks:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/ci-suite.yml
    with:
      suite: ${{ matrix.suite }}
      kind: ${{ matrix.kind }}
      scale_stocks: ${{ inputs.scale_stocks || '' }}
  result:
    name: ${{ github.event_name == 'schedule' && 'CI suite dependency-audit result' || inputs.suite && inputs.suite != 'common' && format('CI suite {0} result', inputs.suite) || 'CI common result' }}
    if: always()
    needs: [plan, checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$PLAN_RESULT" = success && test "$CHECK_RESULT" = success
