# ════════════════════════════════════════════════════════════════
# A股趋势龙头选股、打分与回测系统 — 全局配置
# 所有阈值/权重/参数集中此处，改参不改码（需求 F-CFG-01）
# 默认值来自《需求文档》v0.4 / 《系统设计文档》v0.2
# ════════════════════════════════════════════════════════════════

# ── 路径 ──
paths:
  duckdb_file: "data/ai_stocks.duckdb"
  parquet_dir: "data/parquet"
  export_dir: "data/exports"
  log_dir: "logs"

# ── 前后端文件日志（启动脚本消费，修改后重启对应服务；不进入 PG 覆盖层）──
logging:
  cleanup_interval_sec: 300  # 无输出时也检查跨日归档和过期/容量清理
  backend:
    max_file_mb: 50          # 北京时间跨日或达到单文件上限时归档
    retention_days: 30
    total_size_mb: 1024      # gzip 归档总容量；超限优先删除最旧文件
  frontend:
    max_file_mb: 20
    retention_days: 7
    total_size_mb: 200       # 每个端口实例独立计算

# ── DuckDB 进程内读并发 ──
duckdb:
  read_pool_size: 4             # 逻辑只读连接数；环境变量设 0 可紧急退回单连接
  read_acquire_timeout_sec: 3   # 读连接池等待上限（秒）
  slow_query_ms: 500            # 慢查询告警阈值（毫秒）

# ── 数据源（可插拔，F-DAT-11）──
datasource:
  primary: "akshare"          # 主源
  fallback: "baostock"        # 补退市股/复权因子
  history_years: 10           # 历史深度近 10 年
  capital_review_batch_size: 50  # 每次日常更新轮询股本历史缺口/不一致股票；0关闭
  capital_review_interval_days: 7 # 无新增证据的同股历史复查间隔；失败次日可重试
  rate_limit_per_sec: 5       # 限流：每秒请求数
  max_retries: 3              # 重试次数
  retry_backoff_sec: 2        # 重试退避秒数
  socket_timeout_sec: 30      # 全局 socket 超时（秒），防公开接口请求挂死
  baostock_login_timeout_sec: 120  # BaoStock 登录等待；登录后仍使用请求超时
  cache_enabled: true

# ── 个股分时（数据库归档 + 查询缓存）──
intraday:
  enabled: true
  supported_trade_days: 8      # 数据管理采集的源端近期交易日窗口
  cache_ttl_sec: 43200         # 数据库逐股逐日归档查询缓存 12 小时
  # 请求限流、超时、重试和退避统一使用 datasource 的系统生效配置
  lock_wait_sec: 20

# ── 标的范围 ──
universe:
  boards: ["主板", "创业板", "科创板"]   # 不含北交所
  include_bse: false                      # 北交所开关（架构预留）
  exclude_st: true                        # 剔除 ST/*ST
  min_list_days: 60                       # 硬剔除上市 <60 交易日次新
  long_period_na_days: 480                # 上市 <480 日：长周期指标判"不适用"
  exclude_suspended: true                 # 剔除停牌
  exclude_one_word_limit: true            # 剔除一字涨停（当日买不进）
  float_mv_min: 5.0e9                      # 流通市值下限 50 亿
  float_mv_max: 4.0e10                     # 流通市值上限 400 亿

# ── 涨跌停限制（按板块；ST 历史切换规则在 backend.market_rules）──
price_limit:
  main_board: 0.10        # 主板 ±10%
  star_gem: 0.20          # 科创/创业 ±20%
  st: 0.05                # 历史主板 ST 旧口径：2026-07-06 前 ±5%；之后按市场规则切到主板 ±10%

# ── 指标参数（默认且可配，需求第 6 章）──
indicators:
  ma_periods: [5, 10, 20, 60, 250]
  hhv_periods: [60, 120, 240, 480]   # 60日/120日/一年/两年 新高
  ma_up_lookback: 5                  # 均线向上回溯 K
  vol_breakout_n: 20                 # 放量均量窗口
  vol_breakout_x: 2.0                # 放量倍数
  vol_sustain_s: 5                   # 持续放量短窗
  vol_sustain_y: 1.5                 # 持续放量倍数
  platform_breakout_n: 60            # 平台高点窗口（用 shift(1) 防自指）
  turnover_healthy_min: 3.0          # 健康换手下限 %
  turnover_healthy_max: 20.0         # 健康换手上限 %
  turnover_risk_high: 35.0           # 换手过热风险 %
  rs_window: 120                     # RS 回溯窗口
  adjust: "qfq"                      # 指标计算复权方式（前复权）

# ── 评分模型（默认权重，可配，需求 §7.2）──
scoring:
  weights:
    position: 30      # 位置（新高）
    trend: 20         # 均线趋势
    volume: 20        # 成交量
    turnover: 10      # 换手率
    rs: 10            # RS 强度
    fund_flow: 0      # 资金流（MVP 置 0）
  normalize_to_100: true   # 资金流缺失时其余维度重新归一到 100
  top_n: 20                # 榜单 Top N
  grade_thresholds:        # 分档阈值（可配）
    watch: 80              # 观察
    leader: 90             # 龙头候选
    core: 95               # 主升浪核心

# ── 回测（默认参数，需求 §9.2 / SDD §10.1）──
backtest:
  # 指数代码统一带交易所后缀，杜绝与深市个股(000xxx)代码冲突
  benchmark_main: "000905.SH"       # 主基准：中证 500
  # 其它可选基准同时作为指数采集清单；中证全指 000985.SH 免费源暂取不到，待补
  benchmark_others: ["000300.SH", "000001.SH", "000688.SH", "399001.SZ", "399006.SZ"]
  initial_capital: 1000000.0        # 初始资金 100 万
  top_n: 20                         # 每期最多持仓
  lot_size: 100                     # 100 股整手
  buy_price: "next_open"            # 买入价：次日开盘
  sell_rule: "break_ma"             # 卖出：跌破均线
  sell_ma_period: 20                # 默认跌破 MA20 卖
  capital_alloc: "equal"            # 资金分配：等权
  industry_max_pct: null            # 单行业持仓上限（null=关闭）
  # 信号质量口径（核心概率口径）
  hit_horizons: [5, 10, 20, 60]     # N 档
  hit_thresholds: [0.10, 0.20, 0.30] # X 档
  hit_horizon_main: 20              # 主口径 N=20
  hit_threshold_main: 0.10          # 主口径 X=10%
  # 交易成本（方向性）
  cost:
    commission_rate: 0.00025        # 佣金双边 万2.5
    commission_min: 5.0             # 最低 5 元
    stamp_tax_rate: 0.001           # 印花税卖出 千1
    transfer_fee_rate: 0.00001      # 过户费
    slippage: 0.002                 # 滑点 0.2%（买上浮/卖下浮）

# ── 调度 ──
scheduler:
  enabled: false                    # 默认关闭，手动 CLI 跑
  daily_cron_hour: 18               # 每交易日 18:00 触发
  daily_cron_minute: 0

# ── 服务 ──
server:
  host: "0.0.0.0"          # 0.0.0.0=对外(局域网可访问); 仅本机请改回 127.0.0.1
  port: 8000
  log_level: "info"
  # 仅当后端在可信反代之后、且反代会覆盖(非透传)X-Forwarded-For 时置 true；
  # 直连公网或反代不清洗 XFF 时必须 false，否则 per-IP 限流可被伪造 XFF 头绕过。
  trust_forwarded_for: false

# ── PostgreSQL 资产/权限/审计/字典库（多租户混合持久层，stage1）──
# 行情仍在 DuckDB；用户私有资产与平台元数据在 PG。
# 密码不写此处：整串走环境变量 AI_STOCKS_PG_DSN，或仅密码走 AI_STOCKS_PG_PASSWORD。
postgres:
  host: "127.0.0.1"
  port: 5432
  database: "ai_stocks"
  user: "ai_stocks"
  pool_min: 1               # 连接池下限
  pool_max: 10              # 连接池上限（与 FastAPI 线程池并发匹配）

# ── Redis 短状态库（限流/验证码/token黑名单/perm_ver；stage1 仅建底座）──
# 密码不写此处：整串走环境变量 AI_STOCKS_REDIS_URL，或仅密码走 AI_STOCKS_REDIS_PASSWORD。
redis:
  host: "127.0.0.1"
  port: 6379
  db: 0

# ── 认证与鉴权（多租户 RBAC stage2）──
# JWT 签名密钥不写此处：必须走环境变量 AI_STOCKS_JWT_SECRET（可由 .env.local 提供；无弱默认，缺失即报错）。
# 管理员初始密码走 AI_STOCKS_ADMIN_PASSWORD（缺失则随机生成并日志告警一次）。
auth:
  algorithm: "HS256"
  access_ttl_min: 60           # access token 有效期（分钟）
  refresh_ttl_days: 14         # refresh token 有效期（天）
  min_password_len: 8          # 注册/改密密码最小长度
  # 登录失败与锁定（R15）
  max_login_fail: 5
  fail_window_min: 15
  lock_minutes: 15
  # 防滥用开关（R16；默认邮箱码开、图形码关，可视化开关页留阶段五）
  require_email_code: true
  login_captcha_enabled: false
  captcha_after_fails: 3
  email_code_ttl_min: 10
  captcha_ttl_min: 5
  # 限流（R15；按 IP/邮箱维度）
  login_rate_per_min: 10
  register_rate_per_hour: 5
  email_code_rate_per_hour: 5      # 单邮箱每小时验证码上限
  email_code_ip_rate_per_hour: 20  # 单 IP 每小时验证码上限（防对海量不同邮箱各发几次）
  api_rate_per_min: 600            # 全局 /api 单 IP 每分钟上限（应用层 backstop；反代做主限流）

# ── 邮件发送（SMTP）──
# 此处仅为安全基线默认：enabled=false（降级 dev 日志，不真发信）、账号留空。
# 真实发信账号与开关不入仓库，走环境变量覆盖（对齐 PG/Redis/JWT，见 .env.local.example）：
#   AI_STOCKS_SMTP_ENABLED / AI_STOCKS_SMTP_USERNAME / AI_STOCKS_SMTP_SENDER / AI_STOCKS_SMTP_PASSWORD
# Gmail 等用「应用专用密码」，需先开两步验证再到 https://myaccount.google.com/apppasswords 生成。
mail:
  enabled: false               # 基线关闭；真实环境用 AI_STOCKS_SMTP_ENABLED=1 覆盖
  host: "smtp.gmail.com"       # SMTP 服务器（非敏感，可留通用默认）
  port: 465                    # 465=SSL / 587=STARTTLS
  use_ssl: true                # true=SMTP_SSL(465)；false=SMTP+starttls(587)
  username: ""                 # 留空；真实账号走 AI_STOCKS_SMTP_USERNAME
  sender: ""                   # 留空则回落 username；可用 AI_STOCKS_SMTP_SENDER 覆盖显示名
  timeout_sec: 10

# 同花顺板块直连源请求参数（板块概念 R1-R4；独立于 datasource 通用行情源——同花顺是独立反爬直连源，
# 频率限制比 akshare/baostock 更敏感，故限流/超时/重试单独配置、单独 Web 可调（数据治理·同花顺板块）。
# min_interval_sec 为相邻两次请求最小间隔：实测 1.0s 稳定，风控收紧（如 401 频发）时调大到 2.0~3.0。
ths_board:
  min_interval_sec: 1.0      # 相邻请求最小间隔（秒），越小请求越快
  timeout_sec: 10.0          # 单请求超时（秒）
  max_retries: 3             # 失败重试次数
  retry_backoff_sec: 2.0     # 重试退避基数（秒，指数退避）
  member_update_interval_days: 7  # 成分快照更新间隔（天）
  cookie_validity_days: 30    # 登录 Cookie 默认有效期提醒（天）；连通测试会做真实登录态校验
