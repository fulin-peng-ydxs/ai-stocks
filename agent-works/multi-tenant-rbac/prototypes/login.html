<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 / 注册页原型 · 复盘啦（科技风 · 黑白双主题）</title>
<!--
  页面原型：登录 / 注册页（P1，需求 R4/R5/R6/R16）。
  说明：自包含静态 HTML，无外部依赖，浏览器直接打开。右上「☀/☾」切换黑/白两套主题。
  作用：作为需求文档「7.1 页面布局」的视觉原型事实源，并作为前端 LoginView.vue 的实现参照。
  约定：CSS 变量 :root=浅色(白)、[data-theme=dark]=深色(黑)，对应前端 useTheme() 切 html.dark；
        颜色取值对齐 frontend/src/styles/global.css 的 --chrome-* / technology 预设语汇。
  注意：登录页是「全屏独立壳」，脱离主框架 LayoutHost/侧边栏，不套用布局 archetype。
-->
<style>
  :root {
    --login-page-bg: #ffffff;
    --login-panel-bg: #f3f7fc;
    --login-grid: #e6eef8;
    --login-card-bg: #ffffff;
    --login-border: #dbe5f0;
    --login-border-dash: #cdd9e8;
    --login-input-bg: #fafcfe;
    --login-text: #0c2c4f;
    --login-text-sub: #5b7799;
    --login-text-muted: #8aa3c2;
    --login-brand: #185fa5;
    --login-accent: #2f81f7;
    --login-accent-text: #ffffff;
    --login-captcha-bg: #eef4fb;
    --login-toggle-bg: #f3f7fc;
    --login-divider: #e2eaf3;
  }
  html[data-theme="dark"] {
    --login-page-bg: #0b1220;
    --login-panel-bg: #0d1526;
    --login-grid: #15233f;
    --login-card-bg: #0b1220;
    --login-border: #24344f;
    --login-border-dash: #24344f;
    --login-input-bg: #0f1a2c;
    --login-text: #e6f0ff;
    --login-text-sub: #9db4d6;
    --login-text-muted: #5e779c;
    --login-brand: #5cc8ff;
    --login-accent: #2f81f7;
    --login-accent-text: #ffffff;
    --login-captcha-bg: #13233c;
    --login-toggle-bg: #111c30;
    --login-divider: #1c2942;
  }
  * { box-sizing: border-box; }
  /* 全屏壳用 height:100% 继承链（html,body=100%），不用 100vh——与前端契约 layout-contract.spec.ts
     的「禁 vh 高度」一致，LoginView.vue 实现照此（或 position:fixed;inset:0）。 */
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--login-page-bg);
    color: var(--login-text);
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    height: 100%;
    transition: background .2s, color .2s;
  }
  /* 左 · 品牌视觉区（科技风：动态网格 + 标语） */
  .brand {
    position: relative;
    padding: 40px;
    background-color: var(--login-panel-bg);
    background-image:
      linear-gradient(var(--login-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--login-grid) 1px, transparent 1px);
    background-size: 28px 28px;
    border-right: 1px solid var(--login-divider);
    overflow: hidden;
  }
  .brand .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 600; color: var(--login-brand); }
  .brand .logo .sub { color: var(--login-text-muted); font-size: 14px; font-weight: 400; }
  .brand .sys { margin-top: 12px; color: var(--login-text-sub); font-size: 14px; }
  .brand .pulse {
    position: absolute; right: -60px; top: 90px; width: 320px; height: 320px;
    border-radius: 50%; border: 1px solid var(--login-grid); opacity: .6;
  }
  .brand .pulse::after {
    content: ""; position: absolute; inset: 40px; border-radius: 50%; border: 1px solid var(--login-grid);
  }
  .brand .tagline { position: absolute; left: 40px; bottom: 84px; font-size: 26px; font-weight: 600; line-height: 1.5; color: var(--login-text); }
  .brand .meta { position: absolute; left: 40px; bottom: 36px; display: flex; align-items: center; gap: 8px; color: var(--login-text-muted); font-size: 13px; }
  .brand .meta .bar { width: 28px; height: 3px; border-radius: 2px; background: var(--login-accent); }

  /* 右 · 认证区 */
  .auth { position: relative; display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--login-card-bg); }
  .theme-toggle {
    position: absolute; top: 24px; right: 28px; width: 34px; height: 34px; border-radius: 8px;
    border: 1px solid var(--login-border); background: var(--login-toggle-bg); color: var(--login-text-sub);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .card { width: 100%; max-width: 380px; }
  .tabs { display: flex; gap: 24px; margin-bottom: 22px; font-size: 16px; }
  .tab { padding-bottom: 8px; color: var(--login-text-muted); cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--login-text); font-weight: 600; border-bottom-color: var(--login-accent); }
  .field {
    display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 12px; margin-bottom: 14px;
    border: 1px solid var(--login-border); border-radius: 6px; background: var(--login-input-bg); color: var(--login-text-muted); font-size: 14px;
  }
  .field svg { flex: none; opacity: .8; }
  .field input {
    flex: 1; border: none; outline: none; background: transparent; color: var(--login-text); font-size: 14px;
  }
  .field input::placeholder { color: var(--login-text-muted); }
  .field .eye { cursor: pointer; }
  .captcha-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .captcha-row .field { flex: 1; margin-bottom: 0; border-style: dashed; border-color: var(--login-border-dash); }
  .captcha-img {
    width: 92px; height: 42px; border-radius: 6px; background: var(--login-captcha-bg); border: 1px solid var(--login-border);
    display: flex; align-items: center; justify-content: center; color: var(--login-brand); letter-spacing: 4px; font-size: 16px; font-weight: 600;
  }
  .hint { font-size: 12px; color: var(--login-text-muted); margin: -6px 0 14px; }
  .btn-primary {
    width: 100%; height: 44px; border: none; border-radius: 6px; background: var(--login-accent); color: var(--login-accent-text);
    font-size: 15px; font-weight: 600; cursor: pointer; letter-spacing: 4px; text-indent: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .row-between { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 13px; }
  .link { color: var(--login-text-sub); cursor: pointer; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--login-text-muted); font-size: 12px; margin: 22px 0 14px; }
  .divider .line { flex: 1; height: 1px; background: var(--login-divider); }
  .socials { display: flex; gap: 12px; justify-content: center; }
  .social {
    width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--login-border); background: var(--login-input-bg);
    color: var(--login-text-muted); font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: not-allowed;
  }
  /* 注册态附加字段，默认隐藏 */
  .register-only { display: none; }
  html[data-mode="register"] .register-only { display: flex; }
  html[data-mode="register"] .login-only { display: none; }
  .email-code .send { color: var(--login-accent); font-size: 13px; cursor: pointer; white-space: nowrap; }

  @media (max-width: 768px) {
    body { grid-template-columns: 1fr; }
    .brand { min-height: 92px; padding: 18px 24px; }
    .brand .tagline, .brand .meta, .brand .pulse, .brand .sys { display: none; }
  }
</style>
</head>
<body>
  <!-- 左 · 品牌视觉区 -->
  <section class="brand">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18 L9 11 L13 14 L20 5"/><circle cx="9" cy="11" r="1.4" fill="currentColor"/><circle cx="13" cy="14" r="1.4" fill="currentColor"/></svg>
      复盘啦
    </div>
    <div class="sys">EOD 趋势龙头研究系统</div>
    <div class="pulse"></div>
    <div class="tagline">数据驱动的<br/>每日复盘</div>
    <div class="meta"><span class="bar"></span> 多租户 SaaS · v0.x</div>
  </section>

  <!-- 右 · 认证区 -->
  <section class="auth">
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换黑/白主题">
      <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
    </button>

    <div class="card">
      <div class="tabs">
        <div class="tab active" data-mode="login" onclick="setMode('login')">登录</div>
        <div class="tab" data-mode="register" onclick="setMode('register')">注册</div>
      </div>

      <!-- 账号 / 邮箱 -->
      <label class="field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        <input type="text" placeholder="账号 / 邮箱" />
      </label>

      <!-- 密码 -->
      <label class="field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" placeholder="密码" />
        <svg class="eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </label>

      <!-- 确认密码（仅注册） -->
      <label class="field register-only">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" placeholder="确认密码" />
      </label>

      <!-- 邮箱验证码（仅注册，开关控制；此处展示带发送倒计时） -->
      <label class="field register-only email-code">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <input type="text" placeholder="邮箱验证码" />
        <span class="send">发送验证码</span>
      </label>

      <!-- 图形验证码（登录失败 N 次后显示，开关控制） -->
      <div class="captcha-row login-only">
        <label class="field">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M3 12h18"/></svg>
          <input type="text" placeholder="图形验证码" />
        </label>
        <div class="captcha-img">7K9A</div>
      </div>
      <div class="hint login-only">图形验证码：登录失败达阈值后出现（受系统设置开关控制）</div>

      <button class="btn-primary login-only">登 录</button>
      <button class="btn-primary register-only">注 册</button>

      <div class="row-between login-only">
        <span class="link" title="占位，后续开放">忘记密码？</span>
        <span class="link" onclick="setMode('register')">没有账号？去注册</span>
      </div>

      <!-- 第三方登录占位（R6：置灰 + 敬请期待） -->
      <div class="divider"><span class="line"></span>第三方登录（敬请期待）<span class="line"></span></div>
      <div class="socials">
        <div class="social" title="手机登录（敬请期待）">手机</div>
        <div class="social" title="邮箱登录（敬请期待）">邮箱</div>
        <div class="social" title="微信登录（敬请期待）">微信</div>
        <div class="social" title="QQ 登录（敬请期待）">QQ</div>
      </div>
    </div>
  </section>

<script>
  // 黑/白主题切换（原型内自包含；前端实现复用 useTheme() 切 html.dark）
  var sunIcon = '<path d="M12 4V2M12 22v-2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M5.6 18.4l-1.4 1.4M19.8 4.2l-1.4 1.4"/><circle cx="12" cy="12" r="4"/>';
  var moonIcon = '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>';
  function applyThemeIcon() {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.getElementById('themeIcon').innerHTML = dark ? sunIcon : moonIcon;
  }
  document.getElementById('themeToggle').addEventListener('click', function () {
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    applyThemeIcon();
  });
  // 登录 / 注册 Tab 切换
  function setMode(mode) {
    document.documentElement.setAttribute('data-mode', mode);
    var tabs = document.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].getAttribute('data-mode') === mode);
    }
  }
  setMode('login');
  applyThemeIcon();
</script>
</body>
</html>
